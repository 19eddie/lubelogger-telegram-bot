name: Release and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Allows manual tag push or retries to trigger just the docker publish
  workflow_dispatch: # Allows manual trigger from UI for retries
    inputs:
      version:
        description: 'Version to build and publish (e.g., 1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    # Only run semantic release on pushes to main branch, not on tag pushes or manual triggers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed for semantic-release to create releases and tags
      issues: write # needed for semantic-release to comment on issues
      pull-requests: write # needed for semantic-release to comment on PRs
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-publish:
    name: Build and Publish Docker Image
    # Run if a new release was published, OR if triggered by a tag push (v*), OR manually
    needs: release
    if: |
      always() &&
      (
        (needs.release.result == 'success' && needs.release.outputs.new_release_published == 'true') ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read # needed to checkout code
      packages: write # needed to push docker image to ghcr.io
    steps:
      - name: Determine version
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          NEW_RELEASE_VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "VERSION=$NEW_RELEASE_VERSION" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Extract version from tag (e.g., refs/tags/v1.0.0 -> 1.0.0)
            TAG_NAME=${GITHUB_REF#refs/tags/v}
            echo "VERSION=${TAG_NAME}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
             # Remove 'v' prefix if user accidentally included it, safely using env var
             CLEAN_VERSION=$(echo "$INPUT_VERSION" | sed 's/^v//')
             echo "VERSION=${CLEAN_VERSION}" >> "$GITHUB_ENV"
          else
             echo "Could not determine version"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v${{ env.VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ env.VERSION }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
